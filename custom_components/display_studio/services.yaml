show_view:
  name: Show saved view
  description: Show a saved Studio view through its configured output adapter. HDMI/OSD remain controlled by the hardware integration.
  target:
    entity:
      integration: display_studio
      domain: media_player
  fields:
    config_entry_id:
      name: Studio configuration (alternative to entity target)
      selector:
        config_entry:
          integration: display_studio
    view:
      required: true
      example: dashboard
      selector:
        text:
    transition:
      default: none
      selector:
        select:
          options:
            - none
            - smooth
    duration:
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box
    theme:
      selector:
        text:
show_notification:
  name: Show notification
  description: Show a message using the saved notification design. Browser displays support overlay and fullscreen; hardware PiP requires a compatible adapter.
  target:
    entity:
      integration: display_studio
      domain: media_player
  fields:
    config_entry_id:
      name: Studio configuration (alternative to entity target)
      selector:
        config_entry:
          integration: display_studio
    title:
      default: Home Assistant
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    layout:
      default: overlay
      selector:
        select:
          options:
            - overlay
            - pip
            - fullscreen
    duration:
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
